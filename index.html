<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171919">
  <meta name="description" content="Build your ride. Find your rivals. Own the night. An original offline garage and street racing game with five arcade side events, by QSOL-IMC.">
  <title>STREET RACER · Own the night</title>
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to garage</a>
  <div class="shell">
    <header class="topbar">
      <a class="wordmark" href="./" aria-label="Street Racer home"><span class="brand-mark" aria-hidden="true">SR<span>///</span></span><span>STREET<span class="brand-light">RACER</span><small>QSOL-IMC MOTOR WORKS</small></span></a>
      <div class="season"><span class="signal"></span> REDLINE COUNTY <span class="muted">/</span> SUMMER '67</div>
      <div id="account" class="account" aria-label="Career status"></div>
      <button class="icon-button" id="sound-button" data-action="sound" aria-label="Turn sound on" aria-pressed="false"><span aria-hidden="true">♫</span><span class="sound-label">Sound off</span></button>
      <button class="icon-button" data-action="settings" aria-label="Open settings"><span aria-hidden="true">⚙</span></button>
    </header>
    <aside class="sidebar">
      <div class="nav-label">AFTER HOURS CLUB <span>01</span></div>
      <nav id="navigation" aria-label="Main navigation">
        <button data-view="garage" aria-current="page"><span class="nav-icon" aria-hidden="true">⌂</span>Garage<span class="nav-index">01</span></button>
        <button data-view="classifieds"><span class="nav-icon" aria-hidden="true">▤</span>Classifieds<span class="nav-index">02</span></button>
        <button data-view="parts"><span class="nav-icon" aria-hidden="true">⚒</span>Parts & tuning<span class="nav-index">03</span></button>
        <button data-view="meet"><span class="nav-icon" aria-hidden="true">⚑</span>Night meet<span class="nav-index">04</span></button>
        <button data-view="logbook"><span class="nav-icon" aria-hidden="true">◷</span>Logbook<span class="nav-index">05</span></button>
        <button data-view="arcade"><span class="nav-icon" aria-hidden="true">◎</span>Arcade<span class="nav-index">06</span></button>
      </nav>
      <div class="sidebar-bottom"><div class="club-stamp">BUILT.<br>NOT BOUGHT.<span>EVERY BOLT HAS A STORY.</span></div><button data-action="help" class="subtle-button">Driver's handbook <span>↗</span></button><button data-action="save-menu" class="subtle-button">Save / load <span>↗</span></button><div id="save-status" class="save-status" role="status">LOCAL GARAGE · AUTO SAVE</div></div>
    </aside>
    <main id="main" tabindex="-1"><div class="loading">Opening the garage…</div></main>
    <footer class="site-footer"><span>HAND BUILT BY QSOL-IMC</span><span>VANILLAJS · E8 MUSIC · SONIFICATION · GAMES · ARCADE</span><button class="text-button" data-action="credits">Credits & sources</button></footer>
  </div>
  <section id="race-screen" class="race-screen" aria-label="Race" hidden></section>
  <section id="arcade-screen" class="race-screen" aria-label="Arcade side event" hidden></section>
  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="icon-button" data-action="close" aria-label="Close dialog">×</button></div><div id="dialog-body"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <noscript><p class="noscript">STREET RACER needs JavaScript to drive. Enable it, then reload this page. No account or server is required.</p></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
