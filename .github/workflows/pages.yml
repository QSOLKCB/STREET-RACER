name: Test and deploy STREET RACER

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: street-racer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test career, driving and audio contracts
        run: node --test tests/*.test.mjs
      - name: Verify source pins and complete offline inventory
        run: |
          node scripts/verify-vendor.mjs
          node scripts/site.mjs refresh
          node scripts/site.mjs check
      - name: Stage only the public game
        run: node scripts/site.mjs build _site
      - name: Install isolated pinned browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/street-racer-browser" --no-save --no-package-lock playwright@1.62.1
          "$RUNNER_TEMP/street-racer-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Play, inspect and test the packaged game
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/street-racer-browser/node_modules/playwright
        run: |
          node tests/browser.mjs
          node tests/racer-browser.mjs
          node tests/racer-endurance-browser.mjs
      - name: Preserve browser evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: street-racer-browser-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the verified Pages site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the static game
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
